limit_req_zone $binary_remote_addr zone=medguide_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=medguide_auth:10m rate=6r/m;

# Forwarded protocol is accepted only from the proxy CIDR configured by the
# operator. A direct client cannot turn an HTTP request into HTTPS by adding a
# header of its own.
geo $realip_remote_addr $medguide_trusted_proxy {
    default 0;
    ${MEDGUIDE_TRUSTED_PROXY_CIDR} 1;
}

map "$medguide_trusted_proxy:$http_x_forwarded_proto" $medguide_client_scheme {
    default $scheme;
    "~^1:https(?:,|$)" https;
}

map "${MEDGUIDE_REQUIRE_HTTPS}" $medguide_https_required {
    default 1;
    "1" 1;
    "true" 1;
    "yes" 1;
    "on" 1;
    "0" 0;
    "false" 0;
    "no" 0;
    "off" 0;
}

map "$medguide_https_required:$medguide_client_scheme" $medguide_https_block {
    default 0;
    "1:http" 1;
}

server {
    listen 80;
    server_name _;

    # Only a configured trusted proxy may replace the client address used by
    # the per-client rate-limit key. Direct clients cannot spoof this header.
    set_real_ip_from ${MEDGUIDE_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Internal container probes; the public application path remains TLS-only.
    location = /_health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        default_type text/plain;
        return 204;
    }

    location = /_api-ready {
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://medguide-api:8000/api/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /api/health {
        return 404;
    }

    location = /api/ready {
        return 404;
    }

    location ~ ^/api/auth/(login|register)$ {
        if ($medguide_https_block = 1) {
            return 426;
        }
        limit_req zone=medguide_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://medguide-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $medguide_client_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        if ($medguide_https_block = 1) {
            return 426;
        }
        limit_req zone=medguide_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://medguide-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $medguide_client_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location / {
        if ($medguide_https_block = 1) {
            return 426;
        }
        try_files $uri $uri/ /index.html;
    }
}
